<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Login - PrimeFaces</title>
</h:head>
<h:body>
    <h:form>
        <p:growl id="messages" showDetail="true" />

        <p:panel header="Iniciar Sesión" style="width:400px; margin:auto; margin-top:100px;">
            <h:panelGrid columns="2" cellpadding="5">

                <h:outputLabel for="username" value="Usuario:" />
                <p:inputText id="username" required="true"
                             requiredMessage="El usuario es obligatorio" />

                <h:outputLabel for="password" value="Contraseña:" />
                <p:password id="password" feedback="false" required="true"
                            requiredMessage="La contraseña es obligatoria" />

                <h:outputLabel />
                <p:commandButton value="Ingresar" update="messages" />
            </h:panelGrid>
        </p:panel>
    </h:form>
</h:body>
</html>
