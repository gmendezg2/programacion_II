<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>Ejemplo Consume API - Posts</title>
    </h:head>
    <h:body>
        <h:form>
            <p:panel header="Consumo de API JSONPlaceholder - Posts">
                <p:outputLabel value="Total: #{postBean.listaPosts.size()}" style="font-weight:bold"/>
                <br/><br/>
                <p:commandButton value="Recargar" action="#{postBean.cargar}" update="@form"/>
                <br/><br/>
                <p:dataTable value="#{postBean.listaPosts}" var="post" 
                             paginator="true" rows="10" 
                             emptyMessage="Sin datos">
                    <p:column headerText="ID">
                        <h:outputText value="#{post.id}" />
                    </p:column>
                    <p:column headerText="User ID">
                        <h:outputText value="#{post.userId}" />
                    </p:column>
                    <p:column headerText="Título">
                        <h:outputText value="#{post.title}" />
                    </p:column>
                    <p:column headerText="Contenido">
                        <h:outputText value="#{post.body}" />
                    </p:column>
                </p:dataTable>
            </p:panel>
        </h:form>
    </h:body>
</html>
